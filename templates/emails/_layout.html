<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light only">
  <title>{{ venue.name }}</title>
</head>
<body style="margin:0;padding:0;background:#f2f1ee;-webkit-text-size-adjust:100%;">
  <div style="display:none;max-height:0;overflow:hidden;opacity:0;">{% block preheader %}{% endblock %}</div>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f2f1ee;">
    <tr><td align="center" style="padding:32px 16px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background:#ffffff;border:1px solid #e4e2dd;border-radius:12px;font-family:Helvetica,Arial,sans-serif;color:#1a1a1a;">
        <tr><td align="center" style="padding:36px 32px 24px;">
          <img src="{{ logo_src }}" width="120" height="75" alt="{{ venue.name }}" style="display:block;border:0;">
        </td></tr>
        <tr><td style="padding:0 32px;"><div style="height:1px;background:#e4e2dd;line-height:1px;font-size:1px;">&nbsp;</div></td></tr>
        <tr><td style="padding:32px 32px 8px;font-size:15px;line-height:1.6;">
          {% block content %}{% endblock %}
        </td></tr>
        <tr><td style="padding:24px 32px 32px;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#faf9f7;border-radius:8px;">
            <tr><td style="padding:18px 20px;font-size:13px;line-height:1.6;color:#555555;">
              <strong style="color:#1a1a1a;letter-spacing:.08em;">{{ venue.name|upper }}</strong><br>
              {% if venue.address %}<a href="https://www.google.com/maps/search/?api=1&amp;query={{ venue.address|urlencode }}" style="color:#555555;text-decoration:underline;">{{ venue.address }}</a><br>{% endif %}
              {% if venue.phone %}<a href="tel:{{ venue.phone|cut:' ' }}" style="color:#555555;text-decoration:none;">{{ venue.phone }}</a>{% endif %}
            </td></tr>
          </table>
        </td></tr>
      </table>
      <p style="margin:16px 0 0;font-family:Helvetica,Arial,sans-serif;font-size:12px;color:#8a8780;">Puedes responder a este correo para cualquier consulta.</p>
    </td></tr>
  </table>
</body>
</html>
