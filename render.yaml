# Las variables sync: false se piden al crear el servicio.
services:
  - type: web
    name: zisa-reservas
    runtime: python
    plan: free
    region: virginia   # crear Neon en AWS us-east-1 (misma region)
    buildCommand: bash build.sh
    startCommand: gunicorn wapp.wsgi:application --workers 2 --timeout 60
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: TIME_ZONE
        value: America/Lima
      - key: DATABASE_URL
        sync: false
      - key: WEB_RESERVATION_TOKEN
        sync: false   # igual a ZISA_RESERVAS_TOKEN en wp-config.php
      - key: CRON_TOKEN
        sync: false
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_HOST_USER
        value: digital@zisa.pe
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        value: Zisa <digital@zisa.pe>
